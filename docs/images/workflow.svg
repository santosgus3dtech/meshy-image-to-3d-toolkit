<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Meshy image-to-3D workflow</title>
  <desc id="desc">Workflow diagram for image normalization, Meshy API task creation, polling, model download, color splitting, repair and slicer-ready output.</desc>
  <rect width="1120" height="500" rx="18" fill="#f8fafc"/>
  <defs>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .api{fill:#eff6ff;stroke:#2563eb}
      .py{fill:#f0fdf4;stroke:#16a34a}
      .out{fill:#fff7ed;stroke:#ea580c}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#111827}
      .h{font-size:22px;font-weight:800}
      .p{font-size:15px}
      .s{font-size:12px;fill:#475569}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="42" y="46" class="t h">Meshy Image to 3D Toolkit</text>
  <text x="42" y="74" class="t s">CLI workflow for AI-generated 3D assets and 3D-print preparation</text>

  <rect x="42" y="135" width="150" height="115" rx="12" class="box"/>
  <text x="72" y="176" class="t p">Input image</text>
  <text x="72" y="202" class="t s">Single or multiview</text>
  <text x="72" y="222" class="t s">Local file only</text>

  <rect x="240" y="135" width="160" height="115" rx="12" class="box"/>
  <text x="268" y="176" class="t p">Normalize</text>
  <text x="268" y="202" class="t s">Data URI</text>
  <text x="268" y="222" class="t s">Request metadata</text>

  <rect x="448" y="115" width="180" height="155" rx="12" class="box api"/>
  <text x="484" y="162" class="t p">Meshy API</text>
  <text x="484" y="188" class="t s">Create task</text>
  <text x="484" y="208" class="t s">Poll status</text>
  <text x="484" y="228" class="t s">Download GLB/STL/3MF</text>

  <rect x="676" y="135" width="170" height="115" rx="12" class="box py"/>
  <text x="710" y="176" class="t p">Post-process</text>
  <text x="710" y="202" class="t s">Color split</text>
  <text x="710" y="222" class="t s">Voxel repair helpers</text>

  <rect x="894" y="135" width="180" height="115" rx="12" class="box out"/>
  <text x="930" y="176" class="t p">Print assets</text>
  <text x="930" y="202" class="t s">GLB / STL / 3MF</text>
  <text x="930" y="222" class="t s">Slicer-ready notes</text>

  <rect x="240" y="330" width="606" height="92" rx="12" class="box"/>
  <text x="278" y="366" class="t p">Guardrails</text>
  <text x="278" y="392" class="t s">Timeouts, JSON artifacts, ignored generated outputs, env-based API key and reproducible CLI commands.</text>

  <path d="M192 192 H240" class="arrow"/>
  <path d="M400 192 H448" class="arrow"/>
  <path d="M628 192 H676" class="arrow"/>
  <path d="M846 192 H894" class="arrow"/>
  <path d="M538 270 V330" class="arrow"/>
</svg>
