name: checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm install
      - name: Check Node CLIs
        run: npm run check
      - name: Compile Python helpers
        run: python -m py_compile src/*.py
